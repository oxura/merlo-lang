[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merlo"
version = "0.1.0a3.dev0"
description = "Merlo alpha compiler, native backend, project tooling, and language server"
readme = "README.md"
authors = [{name = "Mansurshakh Japarov"}]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
keywords = ["Merlo", "compiler", "programming language", "static typing", "semantic IR", "AI-native tooling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/oxura/merlo-lang"
Documentation = "https://github.com/oxura/merlo-lang/tree/main/docs"
Issues = "https://github.com/oxura/merlo-lang/issues"
Repository = "https://github.com/oxura/merlo-lang"

[project.optional-dependencies]
test = ["pytest", "build"]
verify = ["z3-solver>=4.13"]

[project.scripts]
merlo = "merlo.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["merlo*"]

[tool.setuptools.package-data]
merlo = ["stdlib/*.mlo", "stdlib/std/*.mlo"]

[tool.merlo]
release = "0.1.0-alpha.3-dev"
edition = "alpha.3-dev"
platform = "Linux x86-64"
compiler_host = "C11 Clang/GCC bootstrap"
semantic_core = "one semantic core; no future facets in alpha"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
