name: Apply loop borrow state fix

on:
  push:
    branches: [codex/place-model]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'oxura'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/place-model
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch complete loop-visible borrow state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/merlo/structured_hir_v2.py')
          source = path.read_text(encoding='utf-8')

          old_visible = '''    @staticmethod
          def _loop_visible_state(
              before: _OwnershipState,
              candidate: _OwnershipState,
          ) -> _OwnershipState:
              return _OwnershipState(
                  {
                      name: candidate.statuses.get(name, "absent")
                      for name in before.statuses
                  },
                  {
                      name: candidate.borrows[name]
                      for name in before.borrows
                      if name in candidate.borrows
                  },
                  {
                      name: candidate.places[name]
                      for name in before.places
                      if name in candidate.places
                  },
                  False,
                  {
                      name: candidate.borrow_places[name]
                      for name in before.borrow_places
                      if name in candidate.borrow_places
                  },
              )
          '''

          new_visible = '''    @staticmethod
          def _loop_visible_borrow_names(
              before: _OwnershipState,
              candidate: _OwnershipState,
          ) -> set[str]:
              """Return borrow bindings stored in places visible before the loop."""
              visible_roots = {
                  place.root
                  for place in before.places.values()
              }
              return {
                  name
                  for name, place in candidate.borrow_places.items()
                  if place.root in visible_roots
              } | {
                  name
                  for name in before.borrows
                  if name in candidate.borrows
              }

          @staticmethod
          def _loop_visible_state(
              before: _OwnershipState,
              candidate: _OwnershipState,
          ) -> _OwnershipState:
              visible_borrows = _OwnershipChecker._loop_visible_borrow_names(
                  before,
                  candidate,
              )
              return _OwnershipState(
                  {
                      name: candidate.statuses.get(name, "absent")
                      for name in before.statuses
                  },
                  {
                      name: candidate.borrows[name]
                      for name in visible_borrows
                      if name in candidate.borrows
                  },
                  {
                      name: candidate.places[name]
                      for name in before.places
                      if name in candidate.places
                  },
                  False,
                  {
                      name: candidate.borrow_places[name]
                      for name in visible_borrows
                      if name in candidate.borrow_places
                  },
              )
          '''

          old_compare = '''        for name in sorted(before.borrows):
              if candidate.borrows.get(name) != before.borrows[name]:
                  self._error(
                      "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                      name,
                  )
          for name in sorted(before.borrow_places):
              if candidate.borrow_places.get(name) != before.borrow_places[name]:
                  self._error(
                      "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                      name,
                  )
          '''

          new_compare = '''        before_visible = self._loop_visible_state(before, before)
          candidate_visible = self._loop_visible_state(before, candidate)
          if candidate_visible.borrows != before_visible.borrows:
              self._error(
                  "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                  "borrow-state",
              )
          if candidate_visible.borrow_places != before_visible.borrow_places:
              self._error(
                  "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                  "borrow-place-state",
              )
          '''

          if old_visible not in source:
              raise SystemExit('loop-visible state block did not match exact head')
          if old_compare not in source:
              raise SystemExit('loop backedge borrow comparison did not match exact head')

          source = source.replace(old_visible, new_visible, 1)
          source = source.replace(old_compare, new_compare, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Run focused regressions
        run: |
          python -m pip install -e '.[test]' pyflakes
          python -m pytest tests/test_loop_borrow_state_regression.py tests/test_while_ownership.py -q
          python -m pyflakes src/merlo/structured_hir_v2.py tests/test_loop_borrow_state_regression.py
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-loop-borrow-state-fix.yml
          git config user.name 'oxura'
          git config user.email 'grozafroza44@gmail.com'
          git add src/merlo/structured_hir_v2.py tests/test_loop_borrow_state_regression.py .github/workflows/apply-loop-borrow-state-fix.yml
          git commit -m 'fix(ownership): preserve loop-visible borrow state'
          git push origin HEAD:codex/place-model
