name: Apply loop borrow state repair

on:
  push:
    branches: [codex/place-model]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'oxura'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/place-model
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Apply ownership repair
        run: python .github/scripts/fix_loop_borrow_state.py
      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run focused ownership tests
        run: >-
          python -m pytest
          tests/test_loop_borrow_state_regression.py
          tests/test_while_ownership.py
          tests/test_place.py
          tests/test_place_ownership.py
          tests/test_projected_owner_moves.py
          -q
      - name: Remove one-shot repair files
        run: rm .github/scripts/fix_loop_borrow_state.py .github/workflows/apply-loop-borrow-state-fix.yml
      - name: Commit repair
        run: |
          git config user.name oxura
          git config user.email grozafroza44@gmail.com
          git add src/merlo/structured_hir_v2.py tests/test_loop_borrow_state_regression.py .github
          git commit -m 'fix(ownership): preserve loop-created borrow state'
          git push origin HEAD:codex/place-model
