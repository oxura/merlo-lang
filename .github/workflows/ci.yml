name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    name: Production Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install production test dependencies
        run: python -m pip install -e '.[test]' pyflakes
      - name: Production tests
        run: python -m pytest tests/ -q
      - name: Production pyflakes
        run: python -m pyflakes src/merlo tests

  tooling:
    name: Python 3.14 tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install tooling test dependencies
        run: python -m pip install -e '.[test]'
      - name: Active benchmark tests
        run: python -m pytest tools/benchmarks/merlo/tests/ -q
      - name: Release-tool tests
        run: python -m pytest tools/release/merlo/tests/ -q

  archive:
    name: Python 3.14 archive tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install archive test dependencies
        run: python -m pip install -e '.[test]'
      - name: Historical protocol tests
        run: python -m pytest research/archive/historical_protocol/tests/ -q
      - name: Alpha1 archive tests
        run: python -m pytest research/archive/alpha1/tests/ -q

  package-smoke:
    name: Wheel install and project smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install build
          (cd "$RUNNER_TEMP" && python -m build "$GITHUB_WORKSPACE" --wheel --outdir "$GITHUB_WORKSPACE/dist")
      - name: Verify wheel product boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          forbidden = ("/docs/", "/spec/", "/research/", "/rfcs/", "/examples/", "/editors/")
          with ZipFile(wheel) as archive:
              leaked = [name for name in archive.namelist() if any(part in name for part in forbidden)]
          if leaked:
              raise SystemExit(f"wheel contains source-only assets: {leaked}")
          PY
      - name: Install wheel in a fresh environment
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/merlo-wheel-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install dist/*.whl
          "$smoke_root/venv/bin/merlo" --help
          "$smoke_root/venv/bin/merlo" new --json "$smoke_root/project"
          "$smoke_root/venv/bin/merlo" check --json "$smoke_root/project"
          "$smoke_root/venv/bin/merlo" build --json "$smoke_root/project"
          "$smoke_root/venv/bin/merlo" run --json "$smoke_root/project"
          "$smoke_root/venv/bin/merlo" check --json "$GITHUB_WORKSPACE/examples/capacity-ledger"
          "$smoke_root/venv/bin/merlo" build --json "$GITHUB_WORKSPACE/examples/capacity-ledger"
          "$smoke_root/venv/bin/merlo" run --json "$GITHUB_WORKSPACE/examples/capacity-ledger" "$GITHUB_WORKSPACE/examples/capacity-ledger/input.txt"

  native-examples:
    name: Native examples (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install native test dependencies
        run: python -m pip install -e '.[test]'
      - name: Focused native example checks
        env:
          MERLO_C_COMPILER: ${{ matrix.compiler }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from merlo.compiler import compile_project
          from merlo.native_c_backend import compile_c_source, find_c_compiler

          requested = os.environ["MERLO_C_COMPILER"]
          compiler = find_c_compiler(requested)
          if compiler is None:
              raise SystemExit(f"requested compiler is unavailable: {requested}")
          cases = ("automation", "capacity-ledger")
          with TemporaryDirectory() as directory:
              root = Path(directory)
              for name in cases:
                  project = Path("examples") / name
                  compilation = compile_project(
                      project, emit_native=False, require_interface_lock=False
                  )
                  native = compile_c_source(
                      compilation.generated_c,
                      output_dir=root / name,
                      stem="app",
                      compiler=compiler,
                  )
                  if native.status != "MEASURED" or native.binary_path is None:
                      raise SystemExit(
                          f"{name} did not build with {requested}: {native.status}"
                      )
                  completed = subprocess.run(
                      [
                          native.binary_path,
                          str(project / "input.txt"),
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  expected = (project / "expected.txt").read_text(encoding="utf-8")
                  if (
                      completed.returncode != 0
                      or completed.stdout != expected
                      or completed.stderr != ""
                  ):
                      raise SystemExit(
                          f"{name} output mismatch with {requested}"
                      )
          PY

  native-full-suite:
    name: Full native suite (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install native test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run complete production suite with selected compiler
        env:
          MERLO_C_COMPILER: ${{ matrix.compiler }}
        run: python -m pytest tests/ -q

  native-sanitizers:
    name: Native ASan UBSan LSan corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install sanitizer test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compact ASan UBSan LSan gates
        run: |
          python - <<'PY'
          from tools.benchmarks.merlo.alpha_safety import (
              SANITIZERS,
              run_representative_alpha_safety,
          )

          report = run_representative_alpha_safety(
              ".", limit_per_family=1, include_productive=False
          )
          records = report["records"]
          for sanitizer in SANITIZERS:
              statuses = [
                  record["status"]
                  for record in records
                  if record["sanitizer"] == sanitizer
              ]
              if not statuses or any(status != "PASSED" for status in statuses):
                  raise SystemExit(
                      f"{sanitizer} gate did not pass: {sorted(set(statuses))}"
                  )
          PY
      - name: Owning constructor and call temporary safety
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from merlo.compiler import compile_project

          compiler = shutil.which("clang")
          if compiler is None:
              raise SystemExit("Clang is required for the focused ownership gate")
          compilation = compile_project(
              "examples/automation",
              emit_native=False,
              require_interface_lock=False,
          )
          sanitizers = {
              "address": ("ASAN_OPTIONS", "halt_on_error=1:detect_leaks=1"),
              "undefined": ("UBSAN_OPTIONS", "halt_on_error=1:print_stacktrace=1"),
              "leak": ("LSAN_OPTIONS", "exitcode=23:report_objects=0"),
          }
          with TemporaryDirectory(prefix="merlo-owning-call-") as directory:
              root = Path(directory)
              source = root / "automation.c"
              source.write_text(compilation.generated_c, encoding="utf-8")
              for sanitizer, (variable, setting) in sanitizers.items():
                  binary = root / f"automation-{sanitizer}"
                  built = subprocess.run(
                      [
                          compiler,
                          "-std=c11",
                          "-O1",
                          "-fno-omit-frame-pointer",
                          f"-fsanitize={sanitizer}",
                          str(source),
                          "-o",
                          str(binary),
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if built.returncode != 0:
                      raise SystemExit(built.stderr)
                  environment = dict(os.environ)
                  environment[variable] = setting
                  completed = subprocess.run(
                      [binary, "examples/automation/input.txt"],
                      capture_output=True,
                      env=environment,
                      check=False,
                  )
                  if completed.returncode != 0:
                      raise SystemExit(
                          f"{sanitizer} failed: "
                          + completed.stderr.decode("utf-8", errors="replace")
                      )
          PY

  deterministic-artifacts:
    name: Deterministic HIR MIR C and binary artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deterministic-build dependencies
        run: python -m pip install -e '.[test]'
      - name: Compare clean compiler artifacts
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from merlo.compiler import compile_project
          from merlo.native_c_backend import compile_c_source, find_c_compiler

          compiler = find_c_compiler()
          if compiler is None:
              raise SystemExit("no supported C compiler found")
          project = Path("examples/capacity-ledger")

          def build(output: Path):
              compilation = compile_project(
                  project, emit_native=False, require_interface_lock=False
              )
              native = compile_c_source(
                  compilation.generated_c,
                  output_dir=output,
                  stem="app",
                  compiler=compiler,
              )
              if native.status != "MEASURED" or native.binary_sha256 is None:
                  raise SystemExit(f"native artifact was not measured: {native.status}")
              return (
                  compilation.artifacts["hir"].digest,
                  compilation.artifacts["mir"].digest,
                  compilation.artifacts["c11"].digest,
                  hashlib.sha256(compilation.generated_c.encode("utf-8")).hexdigest(),
                  native.binary_sha256,
              )

          with TemporaryDirectory() as directory:
              root = Path(directory)
              first = build(root / "first")
              second = build(root / "second")
          if first != second:
              raise SystemExit(
                  "clean HIR/MIR/generated C/binary artifact hashes differ"
              )
          PY

  release-manifest:
    name: Release manifest required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release validator
        run: python -m pip install -e '.[test]'
      - name: Exercise manifest validation contracts
        run: python -m pytest tools/release/merlo/tests/test_alpha_release.py -q
      - name: Verify required release source inventory
        run: |
          python - <<'PY'
          from pathlib import Path

          from tools.release.merlo.alpha_release import (
              REQUIRED_DOCS,
              REQUIRED_EXAMPLES,
              REQUIRED_LICENSES,
              REQUIRED_METADATA,
              REQUIRED_SPECS,
              REQUIRED_STDLIB,
          )

          root = Path(".")
          required = (
              *REQUIRED_LICENSES,
              *REQUIRED_METADATA,
              *REQUIRED_DOCS,
              *REQUIRED_SPECS,
              *REQUIRED_STDLIB,
              *REQUIRED_EXAMPLES,
          )
          missing = [relative for relative in required if not (root / relative).is_file()]
          if missing:
              raise SystemExit(f"missing required release files: {missing}")
          PY

  place-repair:
    name: Repair PR #79 loop borrow state
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/place-model'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/place-model
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply staged patch
        if: hashFiles('.github/patches/pr79-loop-borrow-state.patch') != ''
        run: git apply --check .github/patches/pr79-loop-borrow-state.patch && git apply .github/patches/pr79-loop-borrow-state.patch
      - name: Remove repair artifacts
        if: hashFiles('.github/patches/pr79-loop-borrow-state.patch') != ''
        run: |
          rm -f \
            .github/patches/pr79-loop-borrow-state.patch \
            .github/workflows/apply-loop-borrow-state-fix.yml \
            .github/workflows/apply-loop-borrow-state-fix-pr.yml \
            .github/loop-fix-trigger.txt \
            .github/loop-fix-trigger-2.txt \
            .github/loop-fix-trigger-3.txt \
            .github/pr-loop-fix-trigger.txt \
            .github/temporary-repair-trigger.txt \
            .github/temporary-repair-trigger-2.txt
      - name: Install focused test dependencies
        if: hashFiles('.github/patches/pr79-loop-borrow-state.patch') != ''
        run: python -m pip install -e '.[test]' pyflakes
      - name: Verify focused ownership repair
        if: hashFiles('.github/patches/pr79-loop-borrow-state.patch') != ''
        run: |
          python -m pytest \
            tests/test_loop_borrow_state_regression.py \
            tests/test_while_ownership.py \
            tests/test_place.py \
            tests/test_place_ownership.py \
            tests/test_projected_owner_moves.py -q
          python -m pyflakes src/merlo/structured_hir_v2.py tests/test_loop_borrow_state_regression.py
          git diff --check
      - name: Commit repair to PR branch
        if: hashFiles('.github/patches/pr79-loop-borrow-state.patch') != ''
        run: |
          git config user.name 'Merlo CI Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ownership): preserve loop-created borrow state'
          git push origin HEAD:codex/place-model

  required-gates:
    name: Required CI gates
    if: ${{ always() }}
    needs:
      - production
      - tooling
      - archive
      - package-smoke
      - native-examples
      - native-full-suite
      - native-sanitizers
      - deterministic-artifacts
      - release-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete or failed prerequisites
        if: >-
          ${{ contains(needs.*.result, 'failure') ||
              contains(needs.*.result, 'cancelled') ||
              contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: Confirm every required gate passed
        run: echo "All required CI gates passed."
