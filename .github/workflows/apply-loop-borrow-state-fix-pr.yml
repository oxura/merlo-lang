name: Apply loop borrow state fix from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/place-model' && github.actor == 'oxura'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/place-model
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch ownership-visible loop borrow projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/merlo/structured_hir_v2.py")
          text = path.read_text(encoding="utf-8")

          if "def _loop_tracked_borrow_names(" in text:
              print("loop borrow-state fix already applied")
              raise SystemExit(0)

          old_visible = '''    @staticmethod
    def _loop_visible_state(
        before: _OwnershipState,
        candidate: _OwnershipState,
    ) -> _OwnershipState:
        return _OwnershipState(
            {
                name: candidate.statuses.get(name, "absent")
                for name in before.statuses
            },
            {
                name: candidate.borrows[name]
                for name in before.borrows
                if name in candidate.borrows
            },
            {
                name: candidate.places[name]
                for name in before.places
                if name in candidate.places
            },
            False,
            {
                name: candidate.borrow_places[name]
                for name in before.borrow_places
                if name in candidate.borrow_places
            },
        )
'''
          new_visible = '''    @staticmethod
    def _loop_tracked_borrow_names(
        before: _OwnershipState,
        candidate: _OwnershipState,
    ) -> set[str]:
        """Return borrow-storage names rooted in places visible at loop entry.

        A pre-existing container may acquire its first contained borrow inside
        the loop. Such a new entry is ownership-visible even though its key was
        absent from ``before.borrows``. Loop projection is therefore driven by
        pre-loop storage roots, not only by pre-existing borrow keys.
        """
        preloop_roots = {place.root for place in before.places.values()}
        names = set(before.borrows) | set(before.borrow_places)
        for name in set(candidate.borrows) | set(candidate.borrow_places):
            storage = candidate.borrow_places.get(name) or candidate.places.get(name)
            if storage is not None and storage.root in preloop_roots:
                names.add(name)
            elif name in before.places:
                names.add(name)
        return names

    @staticmethod
    def _loop_visible_state(
        before: _OwnershipState,
        candidate: _OwnershipState,
    ) -> _OwnershipState:
        tracked_borrows = _OwnershipChecker._loop_tracked_borrow_names(
            before,
            candidate,
        )
        return _OwnershipState(
            {
                name: candidate.statuses.get(name, "absent")
                for name in before.statuses
            },
            {
                name: candidate.borrows[name]
                for name in tracked_borrows
                if name in candidate.borrows
            },
            {
                name: candidate.places[name]
                for name in before.places
                if name in candidate.places
            },
            False,
            {
                name: candidate.borrow_places[name]
                for name in tracked_borrows
                if name in candidate.borrow_places
            },
        )
'''
          if old_visible not in text:
              raise SystemExit("expected _loop_visible_state block not found")
          text = text.replace(old_visible, new_visible, 1)

          old_compare = '''        for name in sorted(before.borrows):
            if candidate.borrows.get(name) != before.borrows[name]:
                self._error(
                    "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                    name,
                )
        for name in sorted(before.borrow_places):
            if candidate.borrow_places.get(name) != before.borrow_places[name]:
                self._error(
                    "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                    name,
                )
'''
          new_compare = '''        for name in sorted(self._loop_tracked_borrow_names(before, candidate)):
            if candidate.borrows.get(name) != before.borrows.get(name):
                self._error(
                    "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                    name,
                )
            if candidate.borrow_places.get(name) != before.borrow_places.get(name):
                self._error(
                    "LoopOwnershipBackedgeRequiresFixedPointSupport: OwnershipAmbiguity",
                    name,
                )
'''
          if old_compare not in text:
              raise SystemExit("expected backedge borrow comparison block not found")
          text = text.replace(old_compare, new_compare, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run focused ownership regressions
        run: |
          python -m pip install -e '.[test]' pyflakes
          python -m pytest \
            tests/test_loop_borrow_state_regression.py \
            tests/test_while_ownership.py \
            tests/test_place.py \
            tests/test_place_ownership.py \
            tests/test_projected_owner_moves.py -q
          python -m pyflakes src/merlo/structured_hir_v2.py tests/test_loop_borrow_state_regression.py
          git diff --check
      - name: Commit fix to PR branch
        run: |
          if git diff --quiet -- src/merlo/structured_hir_v2.py; then
            echo "No code changes to commit"
            exit 0
          fi
          git config user.name "Merlo CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/merlo/structured_hir_v2.py
          git commit -m "fix(ownership): preserve loop-created borrow state"
          git push origin HEAD:codex/place-model
