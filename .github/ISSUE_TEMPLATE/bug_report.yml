name: Bug report
description: Report a reproducible compiler, runtime, CLI, or tooling defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or unpublished security details. Use private security reporting for exploitable issues.
  - type: input
    id: version
    attributes:
      label: Merlo version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python version, and C compiler version
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source or project
      description: Reduce the report to the smallest source and manifest that reproduce it.
      render: merlo
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include whether FFI, an external package, or generated world state is involved.
